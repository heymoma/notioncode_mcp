name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            services/mcp-runtime/package-lock.json
            services/notion-private-mcp/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m venv .runtime/notion-agent-cli-venv
          .runtime/notion-agent-cli-venv/bin/pip install -r requirements.txt
          .runtime/notion-agent-cli-venv/bin/pip install -e .[dev]
      - name: Install Node dependencies
        run: |
          npm --prefix services/mcp-runtime ci
          npm --prefix services/notion-private-mcp ci

      - name: Lint Python
        run: .runtime/notion-agent-cli-venv/bin/ruff check src tests
      - name: Validate configuration handling
        run: .runtime/notion-agent-cli-venv/bin/python -m notion_bridge --check
      - name: Bridge tests
        run: .runtime/notion-agent-cli-venv/bin/python -m unittest discover -s tests/bridge -t . -v

      - name: Coding runtime checks
        run: |
          npm --prefix services/mcp-runtime run check
          npm --prefix services/mcp-runtime test
      - name: Private Notion MCP checks
        run: npm --prefix services/notion-private-mcp run check
      - name: Installer and tooling tests
        run: node --test tests/node/install-config.test.mjs tests/node/patch-webview.test.mjs tests/node/render-config.test.mjs

      - name: Layout and release audits
        run: |
          node scripts/checks/check-layout.mjs
          node scripts/checks/check-public-release.mjs
      - name: Shell syntax
        run: bash -n scripts/install/linux.sh scripts/dev/run-bridge.sh scripts/dev/run-runtime.sh deploy/docker/entrypoint.sh
      - name: systemd unit syntax
        run: |
          node scripts/render-config.mjs deploy/systemd/notioncode-bridge.service /tmp/bridge.service "$PWD" "$HOME" runner
          node scripts/render-config.mjs deploy/systemd/notioncode-runtime.service /tmp/runtime.service "$PWD" "$HOME" runner
          systemd-analyze verify /tmp/bridge.service /tmp/runtime.service || true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the compose deployment
        run: docker compose -f deploy/docker/docker-compose.yml config --quiet

  windows-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$parseErrors
            )
            $errors += $parseErrors
          }
          if ($errors.Count) { $errors | Format-List; exit 1 }
      - run: node scripts/checks/check-layout.mjs
